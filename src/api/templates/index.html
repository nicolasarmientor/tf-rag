{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-[760px] mx-auto min-h-screen flex flex-col px-5 py-11 relative z-[1]">

    <div class="flex flex-row justify-between items-center pb-5">
        <div class="flex flex-col gap-1.5">
            <div class="text-[21px] font-semibold tracking-[-0.4px]">TF-RAG</div>
            <div class="text-[13.5px] text-[#A0A0AC] font-light">Retrieval-augmented answers, grounded in the TensorFlow docs.</div>
        </div>
        <div class="flex flex-row gap-2 items-center bg-white/[0.05] border border-white/[0.12] rounded-full px-[11px] py-[6px] backdrop-blur">
            <div class="w-1.5 h-1.5 bg-[#8AE0CB] rounded-full"></div>
            <div class="text-[11px] text-[#A0A0AC] font-mono tracking-wide">{{ chunk_count }} chunks indexed</div>
        </div>
    </div>

    <div class="w-full h-px bg-white/[0.08]"></div>

    <div id="result" class="flex-1 flex flex-col gap-[38px] py-6 overflow-y-auto no-wrap-scroll">
        <div id="empty-state" class="text-[13px] text-[#63636D] text-center py-10">
            Ask a question about the TensorFlow guide documentation to get started.
        </div>
    </div>

    <form id="ask-form" class="flex flex-col gap-3 items-center">
    <div class="w-full h-14 flex flex-row justify-between items-center bg-white/[0.07] border border-white/[0.15] rounded-[28px] pl-[22px] pr-2 py-2 backdrop-blur-md">
        <input type="text" name="question" required autocomplete="off"
               placeholder="Ask about the TensorFlow API…"
               class="flex-1 bg-transparent border-none outline-none text-[15px] text-[#ECECEF] placeholder:text-[#8C8C98] placeholder:font-light">
        <button type="submit" aria-label="Send question"
                class="w-9 h-9 shrink-0 flex items-center justify-center bg-[#ECECEF] rounded-full hover:opacity-85 active:scale-95 transition">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#151519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
        </button>
    </div>
    <div class="text-[11.5px] text-[#74747F] font-light tracking-wide">Every answer is generated only from retrieved documentation.</div>
</form>

</div>

<script>
let placeholderCounter = 0;

document.getElementById('ask-form').addEventListener('submit', function(evt) {
    evt.preventDefault();

    const input = evt.target.elements['question'];
    const question = input.value;
    if (!question.trim()) return;

    document.getElementById('empty-state')?.remove();

    placeholderCounter++;
    const placeholderId = 'pending-answer-' + placeholderCounter;

    const placeholder = document.createElement('div');
    placeholder.id = placeholderId;
    placeholder.className = 'flex flex-col gap-4 w-full';

    const userBubble = document.createElement('div');
    userBubble.className = 'flex flex-row justify-end';
    userBubble.innerHTML = `<div class="bg-[#1F1F26] border border-white/[0.07] rounded-[18px_18px_4px_18px] px-[18px] py-[13px] max-w-[75%]"><div class="text-[15px] leading-[23px] text-[#ECECEF]"></div></div>`;
    userBubble.querySelector('div div').textContent = question;

    const thinkingCard = document.createElement('div');
    thinkingCard.className = 'max-w-[90%]';
    thinkingCard.innerHTML = `
        <div class="bg-white/[0.05] border border-white/[0.12] rounded-[18px_18px_18px_4px] backdrop-blur-md p-[22px] flex flex-row items-center gap-2">
            <div class="flex gap-1">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <span class="text-[13px] text-[#8C8C98] font-mono">thinking…</span>
        </div>`;

    placeholder.appendChild(userBubble);
    placeholder.appendChild(thinkingCard);

    document.getElementById('result').appendChild(placeholder);
    placeholder.scrollIntoView({ behavior: 'smooth', block: 'end' });

    input.value = '';

    htmx.ajax('POST', '/ask-ui', {
        target: '#' + placeholderId,
        swap: 'outerHTML',
        values: { question: question }
    });
});
</script>
{% endblock %}
